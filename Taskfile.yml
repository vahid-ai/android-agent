version: "3"

vars:
  APPIUM_PORT: 4723
  EMULATOR_SERIAL: emulator-5554
  MITM_PORT: 8080
  AVD_NAME: api36-mitm

tasks:
  bootstrap-mitm-lab:
    desc: Install Android API 36 emulator and mitmproxy lab dependencies
    cmds:
      - ./scripts/bootstrap-android-mitm-lab.sh

  validate-kvm:
    desc: Validate whether this host exposes nested KVM
    cmds:
      - ./scripts/bootstrap-android-mitm-lab.sh --validate-only

  gcp-create-mitm-lab:
    desc: Create a GCP Compute Engine VM with nested virtualization enabled
    cmds:
      - ./scripts/gcp-create-android-mitm-lab.sh

  do-create-mitm-lab:
    desc: Create a DigitalOcean Droplet candidate for KVM validation
    cmds:
      - ./scripts/digitalocean-create-android-mitm-lab.sh

  install-mitm-ca:
    desc: Install mitmproxy CA into the rooted emulator trust stores
    cmds:
      - |
        python3 mac_to_android_corp_cas.py \
          --skip-keychain \
          --extra-ca-pem "${MITMPROXY_CA:-$HOME/.mitmproxy/mitmproxy-ca-cert.pem}" \
          --host "${MITM_TEST_HOST:-example.com}" \
          --proxy "${MITM_OPENSSL_PROXY:-127.0.0.1:{{.MITM_PORT}}}" \
          --serial "{{.EMULATOR_SERIAL}}" \
          {{.CLI_ARGS}}

  run-mitm-lab:
    desc: Print and optionally execute the mitmproxy CA-install lab flow
    cmds:
      - ./scripts/run-mitm-lab.sh {{.CLI_ARGS}}

  start-mitm-emulator:
    desc: Start the Android API 36 lab emulator in the background
    cmds:
      - ./scripts/run-mitm-lab.sh start-emulator

  start-mitmproxy:
    desc: Start mitmweb bound to localhost for emulator proxying
    cmds:
      - ./scripts/run-mitm-lab.sh start-proxy

  configure-android-proxy:
    desc: Route Android emulator traffic through local mitmproxy
    cmds:
      - ./scripts/run-mitm-lab.sh set-proxy

  clear-android-proxy:
    desc: Remove the Android global proxy
    cmds:
      - ./scripts/run-mitm-lab.sh clear-proxy

  install-scrcpy:
    desc: Install scrcpy for Android screen mirroring
    cmds:
      - brew install scrcpy
    status:
      - command -v scrcpy

  start-appium:
    desc: Start the Appium server (foreground)
    cmds:
      - appium --port {{.APPIUM_PORT}}

  start-scrcpy:
    desc: Boot emulator if needed, then mirror with scrcpy
    cmds:
      - |
        # Check if an emulator is already running
        if ! adb devices | grep -q "^emulator-"; then
          echo "No running emulator found. Starting one..."
          AVD=$(emulator -list-avds | head -1)
          if [ -z "$AVD" ]; then
            echo "ERROR: No AVDs available. Create one in Android Studio first."
            exit 1
          fi
          echo "Booting AVD: $AVD"
          emulator -avd "$AVD" -no-snapshot-load &
          # Wait for the device to come online
          adb wait-for-device
          echo "Waiting for boot to complete..."
          while [ "$(adb -s {{.EMULATOR_SERIAL}} shell getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
            sleep 1
          done
          echo "Emulator ready."
        else
          echo "Emulator already running."
        fi
        scrcpy -s {{.EMULATOR_SERIAL}} --max-size 1024

  # Event-driven capture (FastAPI + logcat)
  start-server:
    desc: Start the FastAPI capture server (logcat event-driven)
    dir: server
    cmds:
      - uv run main.py {{.CLI_ARGS}}

  capture:
    desc: Run scrcpy + event-driven capture server (start Appium separately first)
    deps:
      - start-scrcpy
      - start-server

  capture-logcat:
    desc: Full end-to-end logcat capture (emulator + Appium + scrcpy + capture server)
    cmds:
      - |
        # ── 1. Ensure emulator is running ──
        if ! adb devices | grep -q "^emulator-"; then
          echo "No running emulator found. Starting one..."
          AVD=$(emulator -list-avds | head -1)
          if [ -z "$AVD" ]; then
            echo "ERROR: No AVDs available. Create one in Android Studio first."
            exit 1
          fi
          echo "Booting AVD: $AVD"
          emulator -avd "$AVD" -no-snapshot-load &
          adb wait-for-device
          echo "Waiting for boot to complete..."
          while [ "$(adb -s {{.EMULATOR_SERIAL}} shell getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
            sleep 1
          done
          echo "Emulator ready."
        else
          echo "Emulator already running."
        fi

        # ── 2. Start Appium server ──
        if ! curl -s http://127.0.0.1:{{.APPIUM_PORT}}/status | grep -q '"ready":true'; then
          echo "Starting Appium server..."
          appium --port {{.APPIUM_PORT}} &
          APPIUM_PID=$!
          # Wait for Appium to be ready
          until curl -s http://127.0.0.1:{{.APPIUM_PORT}}/status | grep -q '"ready":true'; do
            sleep 1
          done
          echo "Appium ready (pid $APPIUM_PID)."
        else
          echo "Appium already running."
        fi

        # ── 3. Start scrcpy in background ──
        echo "Starting scrcpy..."
        scrcpy -s {{.EMULATOR_SERIAL}} --max-size 1024 &

        # ── 4. Start FastAPI capture server (foreground) ──
        echo "Starting capture server..."
        cd server && uv run main.py --serial {{.EMULATOR_SERIAL}} {{.CLI_ARGS}}

  # Polling capture (standalone, no FastAPI)
  start-poll:
    desc: Start the polling-based capture script
    dir: server
    cmds:
      - uv run poll.py {{.CLI_ARGS}}

  capture-poll:
    desc: Run scrcpy + polling capture (start Appium separately first)
    deps:
      - start-scrcpy
      - start-poll

  stop:
    desc: Tear down lab services started by run-mitm-lab.sh
    cmds:
      - ./scripts/run-mitm-lab.sh stop-proxy
      - ./scripts/run-mitm-lab.sh stop-emulator
